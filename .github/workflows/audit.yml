name: CoreCheck Quality Gate

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL objetivo a auditar'
        required: true
        default: 'https://example.com'
        type: string

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  audit:
    name: CoreCheck DAST Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # npm ci ejecuta postinstall → playwright install chromium
        run: npm ci

      - name: Install Playwright OS dependencies
        # Librerías del sistema en ubuntu-latest (el browser ya viene del postinstall)
        run: npx playwright install-deps chromium

      - name: Run CoreCheck CLI
        id: corecheck
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://example.com' }}
        run: |
          npx tsx src/cli/index.ts \
            --url "$TARGET_URL" \
            --fail-on HIGH \
            --formats json,sarif,html,markdown \
            --output-dir ./audit-results \
            --flat-output

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corecheck-audit-results
          path: ./audit-results
          if-no-files-found: warn

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./audit-results/results.sarif
          category: corecheck

      - name: Comment Markdown report on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: corecheck-audit-report
          path: ./audit-results/report.md
