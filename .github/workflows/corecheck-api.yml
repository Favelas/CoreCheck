name: CoreCheck API CI

on:
  push:
    branches: [main, master]
    paths:
      - 'corecheck-api/**'
      - '.github/workflows/corecheck-api.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'corecheck-api/**'
      - '.github/workflows/corecheck-api.yml'

permissions:
  contents: read

jobs:
  api-quality:
    name: typecheck + contract tests (memory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corecheck-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: corecheck-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Contract + unit tests
        env:
          CORECHECK_PERSISTENCE: memory
        run: npm test

      - name: Build dist
        run: npm run build
