name: CoreCheck DevSecOps Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Monitoreo programado semanal

jobs:
  audit:
    name: Execute CoreCheck Active Audit
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: 5. Ejecutar Motor CoreCheck
        run: npx tsx src/cli.ts

      - name: 6. Subir Artefactos (ZIP con reportes JSON & SARIF organizados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corecheck-audit-results
          path: audit-results/