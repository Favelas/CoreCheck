name: CoreCheck DevSecOps Security Audit

on:
  # Se ejecuta solo en PRs hacia ramas principales o bajo demanda (evita gastar cuotas en cada push local)
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Monitoreo semanal (Lunes 00:00 UTC)

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Execute CoreCheck Active Audit
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: 5. Validar tipos de TypeScript
        run: npm run typecheck

      - name: 6. Compilar código a dist/
        run: npm run build

      - name: 7. Ejecutar Motor CoreCheck CLI
        run: node dist/cli/index.js --url "https://opensource-demo.orangehrmlive.com/" --fail-on HIGH --formats json,html,sarif

      - name: 8. Subir Artefactos (ZIP con reportes JSON & SARIF para descarga)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corecheck-audit-results
          path: audit-results/

      - name: 9. Subir reportes SARIF a la Pestaña de Seguridad de GitHub
        if: always()
        run: |
          for file in audit-results/*/results.sarif; do
            if [ -f "$file" ]; then
              category=$(basename $(dirname "$file"))
              echo "Subiendo $file con categoría $category..."
              
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${{ github.repository }}/code-scanning/sarifs" \
                -f sarif=@"$file" \
                -f category="$category" || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}