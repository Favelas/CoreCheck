name: CoreCheck CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    name: Typecheck, Build & Assessment Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: TypeScript Typecheck (0 Errors Policy)
        run: npm run typecheck

      - name: Build CoreCheck CLI
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Smoke Test - CoreCheck CLI Assessment
        id: smoke
        continue-on-error: true
        run: |
          set +e
          mkdir -p ci-artifacts
          node dist/index.js run \
            --url https://example.com \
            --html --pdf --sarif --json --markdown \
            --out ci-artifacts/ci-report.html \
            --fail-on CRITICAL \
            --skip-license \
            --max-pages 3 \
            --environment staging
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build PR / CI Markdown Summary
        if: always()
        run: |
          mkdir -p ci-artifacts
          SUMMARY="ci-artifacts/summary.md"
          {
            echo "## CoreCheck CI Smoke"
            echo
            echo "- **Repository:** \`${{ github.repository }}\`"
            echo "- **Ref:** \`${{ github.ref_name }}\`"
            echo "- **SHA:** \`${{ github.sha }}\`"
            echo "- **Smoke exit code:** \`${{ steps.smoke.outputs.exit_code || 'n/a' }}\`"
            echo "- **Gate policy:** \`--fail-on CRITICAL\` (pipeline remains green unless the job hard-fails)"
            echo
          } > "$SUMMARY"

          if [ -f ci-artifacts/report.md ]; then
            echo "### Audit Markdown Report" >> "$SUMMARY"
            echo >> "$SUMMARY"
            cat ci-artifacts/report.md >> "$SUMMARY"
          elif [ -f ci-artifacts/findings.json ]; then
            echo "### Findings artifact present" >> "$SUMMARY"
            echo >> "$SUMMARY"
            echo '```text' >> "$SUMMARY"
            node --input-type=module -e "import fs from 'node:fs'; const f=JSON.parse(fs.readFileSync('./ci-artifacts/findings.json','utf8')); console.log('target:', f.target); console.log('score:', f.digitalQualityScore); console.log('gateFailed:', f.gateFailed); console.log('findings:', (f.findings||[]).length);" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
          else
            echo "### Note" >> "$SUMMARY"
            echo >> "$SUMMARY"
            echo "No markdown/JSON audit artifacts were produced by the smoke step. Check the smoke logs and Playwright setup." >> "$SUMMARY"
          fi

          echo "Summary written to ${SUMMARY}"

      - name: Upload Audit Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corecheck-ci-artifacts
          path: |
            ci-artifacts/ci-report.html
            ci-artifacts/interactive-dashboard.html
            ci-artifacts/executive-report.pdf
            ci-artifacts/findings.json
            ci-artifacts/results.sarif
            ci-artifacts/report.md
            ci-artifacts/summary.md
          if-no-files-found: warn

      - name: Sticky PR Comment (CI Summary)
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: corecheck-ci-summary
          path: ci-artifacts/summary.md
