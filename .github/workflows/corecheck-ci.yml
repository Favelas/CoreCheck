name: CoreCheck CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    name: Typecheck, Build & Assessment Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: TypeScript Typecheck (0 Errors Policy)
        run: npm run typecheck

      - name: Build CoreCheck CLI
        run: npm run build

      - name: Run Test Suite
        run: npm test

      # Smoke duro: sin continue-on-error / sin exit 0 forzado.
      # fail-on CRITICAL = self-check del motor (example.com suele tener HIGH, no CRITICAL).
      # Exit 2/3/4 o artefactos incompletos → job ROJO.
      - name: Smoke Test - CoreCheck CLI Assessment
        id: smoke
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts

          set +e
          node dist/index.js run \
            --url https://example.com \
            --html --pdf --sarif --json --markdown \
            --out ci-artifacts/ci-report.html \
            --fail-on CRITICAL \
            --skip-license \
            --max-pages 3 \
            --concurrency 1 \
            --environment staging
          code=$?
          set -e

          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "Smoke CLI exit code: ${code}"

          # Taxonomía Enterprise Hardened
          case "${code}" in
            0)
              echo "Smoke PASS (gate + motor OK)"
              ;;
            1)
              echo "::error::Smoke GATE_FAIL inesperado con --fail-on CRITICAL (exit 1)"
              exit 1
              ;;
            2)
              echo "::error::Smoke CONFIG/license failure (exit 2)"
              exit 2
              ;;
            3)
              echo "::error::Smoke NETWORK/target unreachable (exit 3)"
              exit 3
              ;;
            4)
              echo "::error::Smoke ENGINE/Playwright failure (exit 4)"
              exit 4
              ;;
            *)
              echo "::error::Smoke unknown exit code ${code}"
              exit "${code}"
              ;;
          esac

      - name: Enforce required smoke artifacts
        if: always() && steps.smoke.outcome != 'skipped'
        run: |
          set -euo pipefail
          required=(
            ci-artifacts/ci-report.html
            ci-artifacts/interactive-dashboard.html
            ci-artifacts/executive-report.pdf
            ci-artifacts/findings.json
            ci-artifacts/results.sarif
            ci-artifacts/report.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty required artifact: $f"
              missing=1
            else
              bytes=$(wc -c < "$f" | tr -d ' ')
              echo "OK $f (${bytes} bytes)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Smoke artifacts incomplete — pipeline must fail (no false green)"
            exit 4
          fi

      - name: Build PR / CI Markdown Summary
        if: always()
        run: |
          mkdir -p ci-artifacts
          SUMMARY="ci-artifacts/summary.md"
          {
            echo "## CoreCheck CI Smoke"
            echo
            echo "- **Repository:** \`${{ github.repository }}\`"
            echo "- **Ref:** \`${{ github.ref_name }}\`"
            echo "- **SHA:** \`${{ github.sha }}\`"
            echo "- **Smoke exit code:** \`${{ steps.smoke.outputs.exit_code || 'n/a' }}\`"
            echo "- **Smoke outcome:** \`${{ steps.smoke.outcome }}\`"
            echo "- **Gate policy:** \`--fail-on CRITICAL\` (self-check del motor; artefactos obligatorios)"
            echo "- **Exit taxonomy:** \`0\` PASS · \`1\` GATE_FAIL · \`2\` CONFIG · \`3\` NETWORK · \`4\` ENGINE"
            echo
          } > "$SUMMARY"

          if [ -f ci-artifacts/report.md ]; then
            echo "### Audit Markdown Report" >> "$SUMMARY"
            echo >> "$SUMMARY"
            cat ci-artifacts/report.md >> "$SUMMARY"
          elif [ -f ci-artifacts/findings.json ]; then
            echo "### Findings artifact present" >> "$SUMMARY"
            echo >> "$SUMMARY"
            echo '```text' >> "$SUMMARY"
            node --input-type=module -e "import fs from 'node:fs'; const f=JSON.parse(fs.readFileSync('./ci-artifacts/findings.json','utf8')); console.log('target:', f.target); console.log('score:', f.digitalQualityScore); console.log('gateFailed:', f.gateFailed); console.log('findings:', (f.findings||[]).length); console.log('attestation:', f.attestation?.attestationHash?.slice(0,16));" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
          else
            echo "### Note" >> "$SUMMARY"
            echo >> "$SUMMARY"
            echo "No markdown/JSON audit artifacts were produced by the smoke step." >> "$SUMMARY"
          fi

          echo "Summary written to ${SUMMARY}"

      - name: Upload Audit Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corecheck-ci-artifacts
          path: |
            ci-artifacts/ci-report.html
            ci-artifacts/interactive-dashboard.html
            ci-artifacts/executive-report.pdf
            ci-artifacts/findings.json
            ci-artifacts/results.sarif
            ci-artifacts/report.md
            ci-artifacts/summary.md
          if-no-files-found: error

      - name: Sticky PR Comment (CI Summary)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: corecheck-ci-summary
          path: ci-artifacts/summary.md
