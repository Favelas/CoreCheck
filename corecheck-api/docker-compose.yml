# Fase 3.2: Postgres. API: CORECHECK_PERSISTENCE=postgres
# DATABASE_URL=postgres://corecheck:corecheck@localhost:5432/corecheck_api
# Luego: npm run db:migrate && npm run dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: corecheck-api-postgres
    environment:
      POSTGRES_USER: corecheck
      POSTGRES_PASSWORD: corecheck
      POSTGRES_DB: corecheck_api
    ports:
      - "5432:5432"
    volumes:
      - corecheck_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corecheck -d corecheck_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corecheck_api_pgdata:
