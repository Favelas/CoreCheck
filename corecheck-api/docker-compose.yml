# Fase 3.2 (siguiente): Postgres listo para conectar cuando DATABASE_URL exista.
# La API hoy usa CORECHECK_PERSISTENCE=file|memory vía ReportsRepository.
# Cuando se active el adapter Postgres, este compose cubre el motor local.

services:
  postgres:
    image: postgres:16-alpine
    container_name: corecheck-api-postgres
    environment:
      POSTGRES_USER: corecheck
      POSTGRES_PASSWORD: corecheck
      POSTGRES_DB: corecheck_api
    ports:
      - "5432:5432"
    volumes:
      - corecheck_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corecheck -d corecheck_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corecheck_api_pgdata:
